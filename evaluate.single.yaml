version: 1
mode: run_and_evaluate
seed: 42
sample_count: 1

agent:
  model: gpt-5-nano
  model_timeout_seconds: 300
  search_timeout_seconds: 60
  name: graphresearcher
  max_rounds: 1
  max_workers: 1
  search_dispatch_concurrency: 1
  source_extraction_concurrency: 1
  assess_query_concurrency: 1
  max_retries: 1
  verbosity: normal

execution:
  pipeline: false
  evaluation_max_workers: 1

output:
  root: outputs/evaluations/single-local-gateway
  run_id: gpt-5-nano-single

benchmarks:
  deep_research_bench:
    enabled: true
    runtime:
      backend: openai
      race_model: gpt-5-nano
      fact_model: gpt-5-nano
      model_timeout_seconds: 300
      max_output_tokens: 16000
    selection:
      languages: [en]
    evaluation:
      dimensions: [race]
      max_workers: 1

  wiki_live_challenge:
    enabled: false

  deep_research_bench_ii:
    enabled: false
