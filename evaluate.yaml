version: 1
mode: run_and_evaluate
seed: 42
sample_count: 5

agent:
  model: deepseek-v4-pro
  model_timeout_seconds: 300.0
  search_timeout_seconds: 60.0
  assess_query_concurrency: 3
  name: graphresearcher
  reporter:
    model: deepseek-v4-pro
    model_timeout_seconds: 300.0
    packet_tokens: 48000
    output_tokens: 40000
  max_rounds: 30
  max_workers: 1 # 同时抽取样本的数量
  search_dispatch_concurrency: 3 # 同时并行 query 的数量
  source_extraction_concurrency: 10 # 同时并行 source extraction 的数量，在 query 间共享
  timeout_seconds: -1 # 无上限
  max_retries: 5
  verbosity: debug

output:
  root: outputs/evaluations/drb1
  run_id: deepseek-v4-pro

benchmarks:
  deep_research_bench:
    runtime:
      backend: openai
      race_model: gpt-5.5
      fact_model: gpt-5.4-mini
      model_timeout_seconds: 600
      max_output_tokens: 64000
    enabled: true
    selection:
      languages: [zh, en]
    evaluation:
      dimensions: [race, fact]
      max_workers: 5
      fact:
        processes: 5

  wiki_live_challenge:
    runtime:
      extract_model: gemini-2.5-flash
      verifier_model: gemini-2.5-flash
      writing_model: gemini-2.5-pro
      embedding_model: text-embedding-3-small
      model_timeout_seconds: 300.0
      max_retries: 3
      concurrency: 10
    enabled: false

  deep_research_bench_ii:
    runtime:
      model: gpt-5.5
      reasoning_effort: medium
      max_output_tokens: 32768
      model_timeout_seconds: 600
    enabled: false
