version: 1
mode: run_and_evaluate
seed: 42
sample_count: 6

agent:
  model: gpt-5-nano
  model_timeout_seconds: 300.0
  search_timeout_seconds: 60.0
  assess_query_concurrency: 3
  name: graphresearcher
  # 每类大模型调用可单独指定模型；留空或删除某个键时回退到上面的 model。
  models:
    planner: gpt-5-nano # init：初始 Query 与研究目标规划
    source_analyzer: gpt-5-nano # Searcher 逐网页来源的证据抽取（调用量最大）
    query_reformulator: gpt-5-nano # 首轮搜索全部撞重时改写检索词
    claim_normalizer: gpt-5-nano # Claim 规范化归并
    query_assessor: gpt-5-nano # Query 证据充分性裁决
    portfolio: gpt-5-nano # 全局组合评估与 gap 取舍
    gap_expander: gpt-5-nano # follow-up 子 Query 撰写
    convergence: gpt-5-nano # 收敛裁决
  reporter:
    model: gpt-5-nano
    # 旧 submit_final_report 审核路径使用的模型；当前确定性工作流不触发，
    # 需要启用时取消注释并填写（留空回退 model）。
    # reviewer_model: gpt-5-nano
    model_timeout_seconds: 300.0
    packet_tokens: 48000
    output_tokens: 40000
  max_rounds: 30
  max_workers: 2 # 同时运行的样本数
  search_dispatch_concurrency: 3 # 同时并行 query 的数量
  source_extraction_concurrency: 10 # 同时并行 source extraction 的数量，在 query 间共享
  timeout_seconds: -1 # 无上限
  max_retries: 5
  verbosity: debug

execution:
  pipeline: true # 每条报告生成结束后即可评估，同时继续生成后续样本。
  evaluation_max_workers: 1 # 同时评估的样本数，可独立于生成并发设置。

output:
  root: outputs/evaluations/drb1
  run_id: gpt-5-nano-local-gateway

benchmarks:
  deep_research_bench:
    runtime:
      backend: openai
      race_model: gpt-5-nano
      fact_model: gpt-5-nano
      model_timeout_seconds: 600
      max_output_tokens: 64000
    enabled: true
    selection:
      languages: [zh, en]
    evaluation:
      dimensions: [race, fact]
      max_workers: 5
      fact:
        processes: 5

  wiki_live_challenge:
    runtime:
      extract_model: gpt-5-nano
      verifier_model: gpt-5-nano
      writing_model: gpt-5-nano
      embedding_model: text-embedding-3-small
      model_timeout_seconds: 300.0
      max_retries: 3
      concurrency: 10
    enabled: false

  deep_research_bench_ii:
    runtime:
      model: gpt-5-nano
      reasoning_effort: medium
      max_output_tokens: 32768
      model_timeout_seconds: 600
    enabled: false
